name: mailpulse

# Development stack. Source is bind-mounted and rebuilt by air on change.
# Every service the app talks to has a healthcheck, because both binaries
# call log.Fatalf when Postgres or Redis is unreachable at startup.
#
# This file is not the default compose name, so pass it explicitly:
#
#   docker compose -f docker-compose.dev.yml up -d --build
#
# or use the Makefile, which already does: make up

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-mailpulse}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d ${DATABASE_NAME:-mailpulse}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    ports:
      # host tools connect on 29092; services inside the network use kafka:9092
      - "${KAFKA_HOST_PORT:-29092}:29092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  # runs to completion, then web and worker start
  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./db/migrations:/migrations:ro
    # The connection flags live in entrypoint rather than command so that
    # `docker compose run --rm migrate <verb>` keeps them: run replaces the
    # whole command, which is what left every make migrate-* target dying with
    # "URL cannot be empty". command carries only the default verb.
    entrypoint:
      - "migrate"
      - "-path=/migrations"
      - "-database=postgres://${DATABASE_USERNAME:-postgres}:${DATABASE_PASSWORD:-postgres}@postgres:5432/${DATABASE_NAME:-mailpulse}?sslmode=disable"
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  web:
    build:
      context: .
      target: dev
    command: ["air", "-c", ".air.web.toml"]
    env_file:
      - .env
    environment:
      # .env points at localhost so the binaries also run from the shell;
      # inside the network they must use the service names
      DATABASE_HOST: postgres
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    healthcheck:
      # /api/health pings postgres and redis and answers 503 when either is
      # down, so this probes the dependencies rather than just the listener.
      # The allowance is generous because air rebuilds on every save.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      target: dev
    command: ["air", "-c", ".air.worker.toml"]
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      # published in dev only, so the loop report can be read from the host.
      # Production keeps it inside the network. Host side only, like the other
      # *_HOST_PORT vars: WORKER_HEALTH_PORT is what the binary itself reads.
      - "${WORKER_HEALTH_HOST_PORT:-3001}:3001"
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    healthcheck:
      # The worker serves no API. This is its own one-route listener, which
      # reports the same dependency check plus whether each loop is still
      # ticking — a wedged poller is the failure a process check cannot see.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # a real IMAP + SMTP server to develop against, so the mail client is
  # exercised for real without pointing at anyone's actual mailbox.
  # users are created on the fly by GREENMAIL_OPTS below.
  greenmail:
    image: greenmail/standalone:2.1.0
    environment:
      # auth.disabled is deliberately NOT set: it makes GreenMail auto-create
      # users on login, which then collides with the ones declared here
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=demo:secret123@corp.com,ops:secret123@corp.com
    ports:
      - "${GREENMAIL_IMAP_PORT:-3143}:3143"
      - "${GREENMAIL_SMTP_PORT:-3025}:3025"
    restart: unless-stopped

  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # adminer's counterpart for Kafka: browse topics, consumer groups and lag
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "${KAFKA_UI_PORT:-8081}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  kafkadata:
  gomod:
  gobuild:
