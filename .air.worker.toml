root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/worker ./cmd/worker"
  bin = "./tmp/worker"
  include_ext = ["go", "json"]
  exclude_dir = ["tmp", "bin", "dist", "db", "api", ".git", ".claude"]
  exclude_regex = ["_test\\.go"]
  delay = 300
  stop_on_error = true
  send_interrupt = true
  kill_delay = "6s"

[log]
  time = true

[misc]
  clean_on_exit = true
